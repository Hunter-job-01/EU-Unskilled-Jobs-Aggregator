name: Check local Arabic translation
on:
  push:
    branches: [main]
    paths:
      - 'src/offline_translation.py'
      - 'scripts/check_offline_translation.py'
      - '.github/workflows/check_offline_translation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: offline-job-translation-v1
      - run: |
          pip install -r requirements-translation.txt langdetect
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Translate public negation and preferred-vs-required fixtures on CPU
        run: python scripts/check_offline_translation.py
