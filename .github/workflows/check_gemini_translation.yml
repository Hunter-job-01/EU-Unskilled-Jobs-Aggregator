name: Check guarded free Arabic translation
on:
  push:
    branches: [main]
    paths:
      - 'src/gemini_translation.py'
      - 'scripts/check_gemini_translation.py'
      - '.github/workflows/check_gemini_translation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check one public requirement fixture without Telegram or private data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_gemini_translation.py
