# =====================================================================
# ci_tests.yml - offline unit tests on every code change
# ---------------------------------------------------------------------
# paths-ignore: pushes/PRs touching ONLY data/** (the bot's scheduled
# data commits) do not trigger CI - the data files carry no code.
# Live network tests stay opt-in (-m live) and never run in CI.
# =====================================================================
name: CI tests

on:
  push:
    paths-ignore:
      - 'data/**'
  pull_request:
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

jobs:
  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run offline test suite
        run: pytest -v
