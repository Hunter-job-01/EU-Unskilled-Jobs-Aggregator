name: Cancel stuck Pages deployment
on:
  workflow_dispatch:
permissions:
  pages: write
  deployments: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel pages deployment by commit id
        run: |
          H_AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          H_ACC="Accept: application/vnd.github+json"
          R="${{ github.repository }}"
          echo "--- POST cancel pages deployment 04328cc..."
          curl -s -w "\nHTTP %{http_code}\n" -X POST -H "$H_AUTH" -H "$H_ACC" \
            "https://api.github.com/repos/$R/pages/deployments/04328cc229fa393a1c73d71604dbaf442f780d31/cancel"
          echo "--- GET pages deployment 04328cc..."
          curl -s -w "\nHTTP %{http_code}\n" -H "$H_AUTH" -H "$H_ACC" \
            "https://api.github.com/repos/$R/pages/deployments/04328cc229fa393a1c73d71604dbaf442f780d31"
