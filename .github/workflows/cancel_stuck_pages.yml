name: Cancel stuck Pages deployment
on:
  workflow_dispatch:
permissions:
  pages: write
  deployments: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Find and cancel in-progress Pages deployment
        run: |
          H_AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          H_ACC="Accept: application/vnd.github+json"
          R="${{ github.repository }}"
          curl -s -H "$H_AUTH" -H "$H_ACC" "https://api.github.com/repos/$R/pages/deployments?per_page=10" > /tmp/pd.json
          cat /tmp/pd.json | head -c 1500; echo
          IDS=$(jq -r '.[] | select((.status // "") != "succeed" and (.status // "") != "failed" and (.status // "") != "cancelled" and (.status // "") != "canceled" and (.status // "") != "errored") | .id' /tmp/pd.json)
          echo "stuck ids: $IDS"
          for ID in $IDS; do
            echo "--- cancel $ID"
            curl -s -w "%{http_code}\n" -X POST -H "$H_AUTH" -H "$H_ACC" \
              "https://api.github.com/repos/$R/pages/deployments/$ID/cancel"
          done
          # also kill any non-terminal classic deployments
          DIDS=$(curl -s -H "$H_AUTH" -H "$H_ACC" "https://api.github.com/repos/$R/deployments?per_page=10" | jq -r '.[].id')
          for D in $DIDS; do
            curl -s -o /dev/null -w "inactive $D %{http_code}\n" -X POST -H "$H_AUTH" -H "$H_ACC" \
              -d '{"state":"inactive","description":"unstick pages lock"}' \
              "https://api.github.com/repos/$R/deployments/$D/statuses"
          done
