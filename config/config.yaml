  # Negation cues: suppress a signal match when the posting explicitly
  # denies it in the same sentence ("we do NOT offer visa sponsorship").
  # A cue never suppresses a keyword that contains negation itself
  # ("no language required" stays a positive flexibility signal), and
  # the language_flex and no_exp_or_training categories are never
  # suppressed at all (they are positive BECAUSE they negate a
  # requirement: "no experience", "bez doswiadczenia", "ohne
  # erfahrung", "keine vorkenntnisse", "bez praxe", "zonder ervaring",
  # "sin experiencia", "senza esperienza", "sans experience", "sem
  # experiencia", "tapasztalat nelkul", "fara experienta", "be
  # patirties", "bez pieredzes", "ilma kogemuseta", "utan erfarenhet",
  # "ingen erfaring", "ei kokemusta", "bez iskustva", "brez izkusenj",
  # "без опит", "χωρις προϋπηρεσια").
  negation_cues:
    en: ["no", not, never, without, cannot, "do not", "does not", "don't", "doesn't", "isn't", "aren't"]
    de: [kein, keine, keinen, nicht, ohne]
    pl: [nie, brak, bez]
    cs: [ne, bez, zadny]
    sk: [ne, bez, ziadna, ziadny]
    nl: [geen, niet, zonder]
    fr: [pas, sans, aucun, aucune, ne]
    es: ["no", sin, ningun, ninguna]
    it: [non, senza, nessun, nessuna]
    pt: [nao, sem, nenhum, nenhuma]
    ro: [nu, fara]
    hu: [nem, nincs]
    lt: [ne, nera]

  # Words that END a negation's scope: "no experience required" negates a
  # requirement, not the benefits after it ("..., housing provided" counts).
  requirement_markers:
    en: [require, required, requirement, needed, need, necessary, mandatory, must]
    de: [erforderlich, notwendig, benotigt, vorausgesetzt]
    pl: [wymagane, wymagany, wymagana, wymagamy, konieczne]
    cs: [pozadovano, pozadovana, pozadujeme, vyzadovano]
    sk: [pozadovane, vyzadovane, pozadujeme]
    nl: [vereist, verplicht, nodig]
    fr: [requis, exige, obligatoire]
    es: [requerido, requerida, necesario, obligatorio]
    it: [richiesto, richiesta, necessario, obbligatorio]
    pt: [requerido, necessario, obrigatorio]
    ro: [necesar, obligatoriu]
    hu: [szukseges, kotelezo]
    lt: [reikalaujama, butina]
  # Words that AFFIRM a benefit: suffix denials ("sponsorship not available")
  # and the check that stops suffix suppression once the keyword was already
  # affirmed ("housing provided, relocation not available" keeps housing).
  availability_markers:
    en: [available, provided, offered, included, possible, sponsored]
    de: [verfugbar, angeboten, gestellt, moglich, vorhanden]
    pl: [dostepne, oferowane, zapewniane, mozliwe]
    cs: [dispozici, poskytovano, mozne]
    sk: [dispozicii, poskytovane, mozne]
    nl: [beschikbaar, aangeboden, mogelijk]
    fr: [disponible, fourni, propose, possible]
    es: [disponible, proporcionado, ofrecido, posible]
    it: [disponibile, fornito, offerto, possibile]
    pt: [disponivel, fornecido, oferecido, possivel]
    ro: [disponibil, oferit, asigurat, posibil]
    hu: [rendelkezesre, biztositott, lehetseges]
    lt: [prieinama, suteikiama, imanoma]

  # Skilled / senior vocabulary - heavy penalty, auto-reject when the post
  # matches no unskilled role keyword at all.
  negative_roles:
    - software
    - developer
    - engineer
    - manager
    - director
    - accountant
    - nurse
    - doctor
    - physician
    - analyst
    - consultant
    - lawyer
    - architect
    - senior
    - kierownik
    - leiter
    - vedouci
    - gerente
    - responsabile
    - chef d'equipe
  # Explicit disqualifiers - hard reject (matched as regex on folded text).
  disqualifiers:
    - eu[- ]citizens? (only|required)
    - only eu citizens
    - eu[- ]passport
    - native speaker (only|required)
    - \b(c1|c2)\b.{0,30}(required|erforderlich|wymagane|pozadovano|richiesto|requis|necesario)
    - tylko obywatele ue
    - obywatelstwo ue wymagane
    - eu-staatsburgerschaft erforderlich
    - pouze obcane eu
    - solo cittadini ue
    - ciudadania ue
    - citoyens ue uniquement
    - alleen eu-burgers
    - doar cetateni ue
    - csak eu-s allampolgarok
    - apenas cidadaos da ue

# --------------------------- Scoring ---------------------------------
# The score is RELEVANCE evidence (does this look like entry-level,
# foreign-worker-friendly work?), not a legal eligibility verdict.
scoring:
  base_role_points: 30
  extra_role_keyword_points: 5
  extra_role_keyword_cap: 15
  no_exp_points: 15            # no_exp_or_training signal bonus
  permit_points: 25
  housing_points: 15
  language_flex_points: 10
  agency_relocation_points: 10
  negative_role_penalty: 50
  tier_multipliers: {1: 1.15, 2: 1.05, 3: 1.0}
  recency:
    - {max_days: 3, points: 10}
    - {max_days: 7, points: 6}
    - {max_days: 14, points: 3}
  min_score_default: 20

# --------------------------- Batching --------------------------------
batch:
  results_per_page: 50          # EURES max is 50
  max_pages_per_keyword: 2
  keywords_per_country: 8       # per country per source, native first
  delay_between_requests_sec: [1.5, 4.0]
  delay_between_countries_sec: [5.0, 12.0]
  request_timeout_sec: 30
  retries: 3
  backoff_base_sec: 2.0
  backoff_max_sec: 45.0
  jobspy_hours_old: 720         # last 30 days
  jobspy_results_wanted: 25
  jobspy_sites: [indeed]        # "linkedin" possible but blocks aggressively; enable knowingly
  # EURES query expansion for JobSpy/Indeed-unsupported countries. With no
  # Indeed domain, LT and SK (tier 1) would be under-sampled next to
  # PL/CZ/DE, so EURES compensates with a wider keyword set and one more
  # page per keyword. Extensible: add any country code to the list.
  eures_boost:
    countries: [LT, SK]
    keywords_per_country: 16    # vs keywords_per_country: 8 elsewhere
    max_pages_per_keyword: 3    # vs max_pages_per_keyword: 2 elsewhere

# --------------------------- Proxies ---------------------------------
# Fallback only: requests go direct first; proxies (if any) are tried only
# after direct attempts fail, then the client falls back to direct again.
# Free proxies are unreliable and often blocked by Cloudflare - expect them
# to fail; the system is designed to keep working without them.
proxies:
  enabled: false
  env_var: EJA_PROXIES          # comma-separated, e.g. "http://h1:8080,http://h2:3128"

# ------------------------- Translation -------------------------------
translation:
  enabled: true
  target: en
  max_per_run: 200              # polite HTTP request cap per run; skipped titles keep original text
  # Quota discipline: scoring (exclusion checks + keyword/signal scoring)
  # runs BEFORE translation, and only jobs that were not excluded AND
  # reached this score are translated - highest score first, so the
  # request cap is never wasted on low-value or excluded postings.
  min_score: 40

# ------------------- Telegram digest (Phase 4) -----------------------
# Delivered by src/notifier.py at the end of every main.py run, BEFORE
# the workflows commit data/, so notified_telegram flags are persisted
# in the same commit. Credentials are environment-only (repository
# secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in the workflows) -
# never in this file. Missing credentials or enabled: false are a clean
# no-op (exit 0), so automation never fails on an unconfigured bot.
telegram:
  enabled: true
  min_score: 50               # only jobs at/above this relevance score are digested
  max_jobs_per_digest: 15     # per run, highest score first
  focus_countries: []         # optional ISO codes to restrict the digest; [] = all 27
  dashboard_url: "https://hunter-job-01.github.io/EU-Unskilled-Jobs-Aggregator/"           # optional link appended to the digest header
  message_delay_sec: 1.0      # polite pause between paginated messages

# --------------------------- Storage ---------------------------------
storage:
  data_dir: data
  active_jobs_file: active_jobs.json
  export_csv: latest_export.csv
  run_status_file: run_status.json
  retention_days: 30
  # Tombstone registry: prune() records every pruned uid here, and merge()
  # skips tombstoned uids, so a posting still live on EURES/Indeed shortly
  # after retention expiry is not re-ingested as brand new (no duplicate
  # downstream notifications). Bounded by design: once a uid falls out of
  # the rolling window (tombstone_days / tombstone_max_uids), an old
  # still-live posting can be re-ingested once on a later run.
  tombstone_file: pruned_uids.json
  tombstone_max_uids: 5000
  tombstone_days: 60
  # Daily Telegram digest cadence gate: the date (UTC) of the last
  # successful digest. Committed with the other data files so all
  # workflow runs share it (main.py runs several times a day; the
  # digest itself is daily).
  telegram_state_file: telegram_state.json
