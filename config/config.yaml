  # Positive foreign-hiring signals. A match is a HINT for manual review,
  # never proof of sponsorship or of eligibility for non-EU citizens.
  signals:
    # "No experience required" / "training provided" mentions across all
    # 22 covered languages. The whole category is negation-exempt: these
    # phrases are positive BECAUSE they negate a requirement, so cues
    # like "no", "ohne", "bez", "sin", "sans", "sem", "fara", "be",
    # "ilma", "utan", "ingen", "ei", "brez", "bez" must never suppress
    # them (see KeywordMatrix.NEGATION_EXEMPT_CATEGORIES).
    no_exp_or_training:
      en: [no experience, no experience required, no experience needed, no experience necessary, no previous experience, without experience, entry level, trainee, training provided, on-the-job training, on the job training, full training, full training provided, will train, training given]
      pl: [bez doswiadczenia, bez doswiadczenia zawodowego, do przyuczenia, przyuczymy, szkolenie zapewnione, zapewniamy szkolenie, doswiadczenie nie jest wymagane]
      de: [ohne erfahrung, keine erfahrung erforderlich, keine vorkenntnisse, ohne vorkenntnisse, quereinsteiger, mit einarbeitung, wir lernen dich an, ohne berufserfahrung]
      cs: [bez praxe, zaskolime, zaucime, bez predchozi praxe, praxe neni nutna]
      sk: [bez praxe, zaskolime, zaucime, bez predchadzajucej praxe, prax nie je nutna]
      nl: [zonder ervaring, zonder werkervaring, geen ervaring vereist, geen ervaring nodig, inwerktraject, wij leren je het vak, wordt ingewerkt]
      es: [sin experiencia, no se requiere experiencia, con formacion, formacion a cargo de la empresa, sin experiencia previa]
      it: [senza esperienza, con formazione, formazione fornita, primo impiego, non e richiesta esperienza]
      fr: [sans experience, debutant accepte, formation assuree, sans experience prealable, experience non requise]
      pt: [sem experiencia, com formacao, sem experiencia necessaria, formacao fornecida, nao requer experiencia]
      sv: [ingen erfarenhet, utan erfarenhet, ingen erfarenhet kravs, utbildning ges, vi lar dig]
      da: [ingen erfaring, uden erfaring, oplaering, ingen erfaring kraves]
      fi: [ei kokemusta, ei aikaisempaa kokemusta, koulutetaan, kokemusta ei vaadita]
      lt: [be patirties, apmokome, patirties nereikia, be darbo patirties]
      lv: [bez pieredzes, apmaciba, pieredze nav nepieciesama, apmacam]
      et: [ilma kogemuseta, valjaope, kogemus pole vajalik, kogemust ei nouta]
      hu: [tapasztalat nelkul, betanitott munka, betanitas, nincs szukseg tapasztalatra, betanitast biztositunk]
      ro: [fara experienta, fara experienta necesara, training asigurat, fara experienta prealabila, nu este necesara experienta]
      bg: [без опит, без предишен опит, обучение се осигурява, опит не се изисква]
      hr: [bez iskustva, iskustvo nije potrebno, osigurana obuka, obuka]
      sl: [brez izkusenj, izkusnje niso potrebne, zagotovljeno usposabljanje, usposabljanje]
      el: [χωρις προϋπηρεσια, χωρις εμπειρια, παρεχεται εκπαιδευση, εμπειρια δεν απαιτειται]
    permit:   # explicit work permit / visa vocabulary
      en: [visa sponsorship, work permit, work visa, sponsorship, sponsorship available]
      pl: [zezwoleni, karta pobytu, oswiadczenie o powierzeniu wykonywania pracy, zezwolenie na pobyt]
      de: [arbeitserlaubnis, aufenthaltstitel, visum gesponsert, arbeitsvisum]
      cs: [zamestnanecka karta, pracovni povoleni, povoleni k pobytu]
