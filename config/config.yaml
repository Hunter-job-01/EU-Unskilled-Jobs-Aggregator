# =====================================================================
# EU-Unskilled-Jobs-Aggregator - master configuration (Phase 4)
# ---------------------------------------------------------------------
# Honesty notes baked into this config:
#  * "indeed_supported" reflects the countries actually present in
#    python-jobspy's Country enum (verified against v1.4.1). Indeed /
#    JobSpy does NOT cover BG, HR, CY, EE, LV, LT, MT, SI, SK. Those
#    countries are served by EURES only.
#  * Signal keywords (housing, agency, work permit mentions, and the
#    no_exp_or_training mentions added in Phase 4) are relevance
#    evidence for manual review. They are NOT proof that an employer
#    sponsors non-EU citizens, really requires no experience, or
#    accepts applicants from Egypt.
# =====================================================================

project: EU-Unskilled-Jobs-Aggregator
version: 2.0.0

# ------------------------- Geography --------------------------------
tiers:
  1: [PL, CZ, DE, LT, HU, RO, SK, NL]      # daily / frequent batches
  2: [ES, IT, FR, BE, PT, IE]             # every 2-3 days
  3: [AT, BG, HR, CY, DK, EE, FI, GR, LV, LU, MT, SI, SE]  # rotating subset + weekly

countries:
