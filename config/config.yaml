      de: [zeitarbeit, arbeitnehmeruberlassung, umzugshilfe]
      cs: [pracovni agentura, relokace]
      sk: [pracovna agentura]
      lt: [idarbinimo agentura]
      hu: [munkaero-kozvetito]
      ro: [agentie de munca, agentie de recrutare]
      nl: [uitzendbureau, uitzendwerk]
      es: [agencia de trabajo temporal, ett, reubicacion]
