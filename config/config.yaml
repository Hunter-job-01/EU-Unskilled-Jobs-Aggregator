# ----------------- Multilingual keyword & signal matrix --------------
# Matching is diacritics-insensitive and case-insensitive (a folded form
# of both text and keyword is compared), so "Skladnik" matches "Skladnik".
#
# Coverage: the 22 language codes en, pl, de, cs, sk, lt, hu, ro, nl,
# es, it, fr, pt, sv, da, fi, el, bg, hr, sl, et, lv - the primary
# official/working languages of all 27 member states - for BOTH broad
# unskilled roles AND the "no experience / training provided" signal
# (see signals.no_exp_or_training below). Scope note: this is the
# supplied 22-code set, not literally every official EU language -
# Irish (ga) and Maltese (mt) are not keyword languages; IE and MT are
# queried with their configured languages (en), matching how vacancies
# there are posted. Role scope is deliberately broad:
# warehouse, production, packing, cleaning, agriculture, farms,
# greenhouses, food processing, hospitality, hotels, kitchen help,
# housekeeping, laundry, retail stocking, delivery help and general
# labour - any legitimate entry-level work, not only warehouse/factory.
#
# "No experience required" / "training provided" phrasing lives in the
# no_exp_or_training SIGNAL, not in roles: treating it as a role keyword
# would qualify skilled posts ("senior accountant - no experience
# needed" would look like an unskilled vacancy). The scorer awards base
# points when EITHER a role keyword OR that signal matches (and no
# skilled/senior vocabulary or disqualifier matched), which delivers
# the intended coverage without that false-positive.
