  roles:
    en: [warehouse worker, warehouse operative, order picker, picker, packer, packing operative, production operator, production worker, factory worker, machine operator, assembly worker, general labourer, general laborer, sorter, loader, cleaner, farm worker, agricultural worker, logistics helper, forklift operator, manual worker, unskilled worker, general worker, general helper, kitchen helper, kitchen assistant, dishwasher, housekeeping, room attendant, housekeeper, hotel housekeeper, greenhouse worker, greenhouse, food production, food processing, production line worker, warehouse assistant, stocker, shelf stacker, retail assistant, supermarket assistant, laundry worker, delivery helper, delivery assistant, farm hand, harvest worker, fruit picker, vegetable packer, meat processing, poultry worker, mushroom picker, cleaning assistant, hotel staff, hospitality staff, catering assistant, general operative, warehouse worker trainee, entry level]
